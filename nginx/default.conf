server {
    listen 8080;
    server_name _;
    server_tokens off;

    location = /health {
        proxy_pass http://app:3000/health;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    location = /ready {
        proxy_pass http://app:3000/ready;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    location / {
        return 404;
    }
}
