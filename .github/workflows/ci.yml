name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.12
        env:
          POSTGRES_USER: mashqban_test
          POSTGRES_PASSWORD: mashqban_test
          POSTGRES_DB: mashqban_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mashqban_test -d mashqban_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://mashqban_test:mashqban_test@localhost:5432/mashqban_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test:unit
      - run: bun run test:integration
      - run: docker build --tag mashqban-ci .
