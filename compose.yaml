# Local development database only. Use a separate deployment configuration in production.
services:
  db:
    image: postgres:17.12
    environment:
      POSTGRES_USER: mashqban
      POSTGRES_DB: mashqban
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mashqban -d mashqban"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
